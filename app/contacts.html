<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Looking Store</title>

  <!-- Pure.css CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/pages.css">

</head>
<body>

<header class="header">
  <nav class="pure-menu pure-menu-horizontal">
    <ul class="pure-menu-list">
      <li class="pure-menu-item"><a href="../index.html" class="pure-menu-link">Главная</a></li>
      <li class="pure-menu-item"><a href="contacts.html" class="pure-menu-link active">Контакты / Отзывы</a></li>
      <li class="pure-menu-item"><a href="faq.html" class="pure-menu-link">FAQ</a></li>
    </ul>
  </nav>
</header>

<main class="content">
  <h1>Контакты</h1>

  <section class="contact-info">
    <p><strong>Адрес:</strong> Москва, ул. Примерная, 12</p>
    <p><strong>Телефон:</strong> +7 999 123-45-67</p>
    <p><strong>Email:</strong> info@lookingstore.ru</p>
    <p><strong>Соцсети:</strong> 
      <a href="#">Instagram</a>, 
      <a href="#">VK</a>, 
      <a href="#">Telegram</a>
    </p>
  </section>

  <section class="contact-form">
    <h2>Обратная связь</h2>
    <form class="pure-form pure-form-stacked">
      <label for="name">Имя</label>
      <input type="text" id="name" class="pure-input-1" placeholder="Ваше имя">

      <label for="email">Email</label>
      <input type="email" id="email" class="pure-input-1" placeholder="Ваш Email">

      <label for="subject">Тема</label>
      <input type="text" id="subject" class="pure-input-1" placeholder="Тема сообщения">

      <label for="message">Сообщение</label>
      <textarea id="message" class="pure-input-1" rows="5" placeholder="Ваше сообщение"></textarea>

      <label class="pure-checkbox">
        <input type="checkbox"> Согласие на обработку данных
      </label>

      <button type="submit" class="pure-button pure-button-primary">Отправить</button>
    </form>
  </section>
</main>

<footer class="footer">
  <p>&copy; 2026 Looking Store. Все права защищены.</p>
</footer>

</body>
</html>
